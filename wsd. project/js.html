<!DOCTYPE html>
<html>
<head>
    <title>Registration Form Validation</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
            color:darkblue;
        }
        label{
            font-weight:bold;
        }
        input,select{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
        }

        .gender{
            width:auto;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        .error{
            color:red;
            font-size:14px;
        }
    </style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>

<form onsubmit="return validateForm()">

<label>Full Name</label>
<input type="text" id="name">
<span id="nameError" class="error"></span>

<label>Email</label>
<input type="email" id="email">
<span id="emailError" class="error"></span>

<label>Password</label>
<input type="password" id="password">
<span id="passError" class="error"></span>

<label>Confirm Password</label>
<input type="password" id="confirmPassword">
<span id="confirmError" class="error"></span>

<label>Mobile Number</label>
<input type="text" id="mobile">
<span id="mobileError" class="error"></span>

<label>Age</label>
<input type="number" id="age">
<span id="ageError" class="error"></span>

<label>Gender</label><br>

<input type="radio" name="gender" value="Male" class="gender"> Male

<input type="radio" name="gender" value="Female" class="gender"> Female

<input type="radio" name="gender" value="Other" class="gender"> Other

<br><br>

<span id="genderError" class="error"></span>

<button type="submit">Register</button>

</form>

</div>

<script>

function validateForm()
{

document.getElementById("nameError").innerHTML="";
document.getElementById("emailError").innerHTML="";
document.getElementById("passError").innerHTML="";
document.getElementById("confirmError").innerHTML="";
document.getElementById("mobileError").innerHTML="";
document.getElementById("ageError").innerHTML="";
document.getElementById("genderError").innerHTML="";

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;
let confirmPassword=document.getElementById("confirmPassword").value;
let mobile=document.getElementById("mobile").value.trim();
let age=document.getElementById("age").value;

let gender=document.getElementsByName("gender");

let valid=true;

// Name Validation

let namePattern=/^[A-Za-z ]+$/;

if(name=="")
{
document.getElementById("nameError").innerHTML="Name is required";
valid=false;
}
else if(!namePattern.test(name))
{
document.getElementById("nameError").innerHTML="Only alphabets allowed";
valid=false;
}

// Email Validation

let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(email=="")
{
document.getElementById("emailError").innerHTML="Email is required";
valid=false;
}
else if(!emailPattern.test(email))
{
document.getElementById("emailError").innerHTML="Invalid Email";
valid=false;
}

// Password Validation

if(password.length<8)
{
document.getElementById("passError").innerHTML="Minimum 8 characters";
valid=false;
}

// Confirm Password

if(confirmPassword!=password)
{
document.getElementById("confirmError").innerHTML="Passwords do not match";
valid=false;
}

// Mobile Validation

let mobilePattern=/^[0-9]{10}$/;

if(!mobilePattern.test(mobile))
{
document.getElementById("mobileError").innerHTML="Enter 10 digit mobile number";
valid=false;
}

// Age Validation

if(age<18)
{
document.getElementById("ageError").innerHTML="Age must be 18 or above";
valid=false;
}

// Gender Validation

let selected=false;

for(let i=0;i<gender.length;i++)
{
if(gender[i].checked)
{
selected=true;
}
}

if(!selected)
{
document.getElementById("genderError").innerHTML="Select Gender";
valid=false;
}

if(valid)
{
alert("Registration Successful!");
}

return valid;

}
</script>
</body>
</html>
